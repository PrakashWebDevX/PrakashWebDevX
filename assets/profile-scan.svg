<svg width="420" height="460" viewBox="0 0 420 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frameClip">
      <rect x="20" y="20" width="380" height="380" rx="6"/>
    </clipPath>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00FFCC" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#00FFCC" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#00FFCC" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00FFCC" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="duotone">
      <feColorMatrix type="saturate" values="0.15"/>
      <feColorMatrix type="matrix" values="
        0.1 0 0 0 0
        0.7 0 0 0 0
        0.5 0 0 0 0
        0   0 0 1 0"/>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="420" height="460" fill="#0D1117"/>

  <rect x="20" y="20" width="380" height="380" rx="6" fill="none" stroke="#00FFCC" stroke-opacity="0.5" stroke-width="1.5"/>

  <g stroke="#00FFCC" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M20,45 V20 H45"/>
    <path d="M375,20 H400 V45"/>
    <path d="M400,375 V400 H375"/>
    <path d="M45,400 H20 V375"/>
  </g>

  <g clip-path="url(#frameClip)">
    <image href="https://raw.githubusercontent.com/PrakashWebDevX/PrakashWebDevX/main/assets/photo.jpg" x="20" y="20" width="380" height="380"
           preserveAspectRatio="xMidYMid slice" filter="url(#duotone)"/>
    <rect x="20" y="20" width="380" height="380" fill="#0D1117" opacity="0.25"/>
    <rect x="20" y="20" width="380" height="380" fill="url(#scanlines)"/>

    <rect x="20" y="-60" width="380" height="60" fill="url(#scanGrad)">
      <animate attributeName="y" values="-60;380;-60" keyTimes="0;0.9;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="20" y="415" font-family="Fira Code, monospace" font-size="13" fill="#00FFCC">
    &gt; scanning profile...
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </text>
  <text x="20" y="435" font-family="Fira Code, monospace" font-size="12" fill="#8b949e">Prakash WebDevX · AI Agent Developer</text>
  <text x="20" y="450" font-family="Fira Code, monospace" font-size="11" fill="#8b949e">github.com/PrakashWebDevX</text>
</svg>
