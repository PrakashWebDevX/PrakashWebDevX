
<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="avatarFrame">
      <rect x="40" y="80" width="300" height="300" rx="6"/>
    </clipPath>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00FFCC" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#00FFCC" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#00FFCC" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00FFCC" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="masterScanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FFCC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00FFCC" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="duotone">
      <feColorMatrix type="saturate" values="0.15"/>
      <feColorMatrix type="matrix" values="
        0.1 0 0 0 0
        0.7 0 0 0 0
        0.5 0 0 0 0
        0   0 0 1 0"/>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- card background -->
  <rect width="900" height="480" rx="10" fill="#0D1117" stroke="#00FFCC" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- window title bar -->
  <rect x="0" y="0" width="900" height="40" rx="10" fill="#161B22"/>
  <rect x="0" y="20" width="900" height="20" fill="#161B22"/>
  <circle cx="24" cy="20" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="20" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="20" r="6" fill="#27C93F"/>
  <text x="450" y="25" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#8b949e">profile.scan — prakash-webdevx</text>

  <!-- avatar frame -->
  <rect x="40" y="80" width="300" height="300" rx="6" fill="none" stroke="#00FFCC" stroke-opacity="0.5" stroke-width="1.5"/>
  <g stroke="#00FFCC" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M40,105 V80 H65"/>
    <path d="M315,80 H340 V105"/>
    <path d="M340,355 V380 H315"/>
    <path d="M65,380 H40 V355"/>
  </g>
  <g clip-path="url(#avatarFrame)">
    <image href="https://github.com/PrakashWebDevX.png" x="40" y="80" width="300" height="300"
           preserveAspectRatio="xMidYMid slice" filter="url(#duotone)"/>
    <rect x="40" y="80" width="300" height="300" fill="#0D1117" opacity="0.25"/>
    <rect x="40" y="80" width="300" height="300" fill="url(#scanlines)"/>
    <rect x="40" y="20" width="300" height="60" fill="url(#scanGrad)">
      <animate attributeName="y" values="20;380;20" keyTimes="0;0.9;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="40" y="405" font-family="Fira Code, monospace" font-size="13" fill="#00FFCC">
    &gt; scanning profile...
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <!-- stat readout, staggered reveal -->
  <g font-family="Fira Code, monospace" font-size="15" fill="#c9d1d9">
    <text x="380" y="115" fill="#00FFCC" font-size="16" font-weight="700">
      subject<tspan fill="#8b949e">:</tspan> Prakash WebDevX
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.10;0.90;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="380" y="150">
      role<tspan fill="#8b949e">:</tspan>       AI Agent Developer · Founder, PRTECH.AI
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.20;0.90;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="380" y="180">
      status<tspan fill="#8b949e">:</tspan>     Building autonomous systems, pixel by pixel
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.30;0.90;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="380" y="210">
      languages<tspan fill="#8b949e">:</tspan>  Python · TypeScript · JavaScript
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.40;0.90;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="380" y="240">
      focus<tspan fill="#8b949e">:</tspan>      LangChain · RAG · LLM Orchestration
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.50;0.90;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="380" y="270">
      base<tspan fill="#8b949e">:</tspan>       Coimbatore, India · Remote
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.60;0.90;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="380" y="300">
      contact<tspan fill="#8b949e">:</tspan>    github.com/PrakashWebDevX
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.70;0.90;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <line x1="380" y1="330" x2="860" y2="330" stroke="#00FFCC" stroke-opacity="0.25" stroke-width="1"/>
  <text x="380" y="360" font-family="Fira Code, monospace" font-size="12" fill="#8b949e">
    Every panel here is a single &lt;img&gt; tag — no workflows, no cron jobs.
  </text>
  <text x="380" y="380" font-family="Fira Code, monospace" font-size="12" fill="#8b949e">
    Rendered on request, animated in pure SVG.
  </text>

  <!-- master scan sweep across the entire card -->
  <rect x="0" y="-40" width="900" height="40" fill="url(#masterScanGrad)">
    <animate attributeName="y" values="-40;480;-40" keyTimes="0;0.95;1" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
